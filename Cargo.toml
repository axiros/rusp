[workspace]
resolver = "2"
members = ["rusp-lib", "rusp-bin", "rhai-rusp", "xtask"]

[workspace.dependencies]
rusp-lib = { version = "1", path = "rusp-lib" }
rhai-rusp = { version = "1", path = "rhai-rusp" }

anyhow = "1.0"
argh = { version = "0.1", default-features = false, features = ["help"] }
rhai = { version = "1.22", features = ["serde", "internals"] }
serde_json = "1.0"
